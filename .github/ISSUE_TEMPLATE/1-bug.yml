name: 不具合の報告
description: 動かない・おかしな動きをする
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ご報告ありがとうございます。**パスワード・個人的な文章・見られて困るログは、書かないでください。**
        (この Issue は誰でも読める公開の場所です)

        **単語ではなく、文章で試してください。** Meltype は、文章として打ったときに、前後の流れから推論して英語・日本語を判定し、自動で変換します。
        単語だけを打つと、手がかりが足りず、思った結果にならないことがあります。報告の前に、その語を文章の中で打って、きちんと自動変換されているか確認してください。
        例: 単語だけ「`hosuthingu`」→ 「ほすthinぐ」。文章の中で打つ (「パソコンのホスティング」と打つ) と、「パソコンのホスティング」と変換されます。
        文章にしても直らないときが、不具合です。その文章を報告してください。
  - type: input
    id: app
    attributes:
      label: どのアプリで
      placeholder: "TextEdit / Safari / VS Code など"
    validations:
      required: true
  - type: textarea
    id: typed
    attributes:
      label: 何と打って
      placeholder: "例: kyouhagoogle と打って Enter (単語だけでなく、前後の文章も書いてください)"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: どうなったか (期待した結果も)
      placeholder: "例: 「今日はごおｇぇ」になった (期待: 今日はgoogle)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 26.x / Apple シリコン"
  - type: input
    id: version
    attributes:
      label: Meltype の版
      placeholder: "1.0.9"
  - type: textarea
    id: environment
    attributes:
      label: 実行環境 (メニューの「不具合の報告・提案…」から開くと自動で入ります)
