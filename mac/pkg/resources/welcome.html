<h2>Meltype for Mac</h2>
<p>半角/全角を切り替えずに、日本語と英語を打ち分けられる日本語入力です。</p>
<ul>
<li>対応環境: macOS 13 以降、Apple シリコン (M1 以降)</li>
<li>インストール先: ホームフォルダーの Library/Input Methods (管理者パスワードは不要です)</li>
<li>打った内容をネットワークに送りません</li>
</ul>
<p>「続ける」を押すと、そのままインストールが始まります。</p>
</body></html>
