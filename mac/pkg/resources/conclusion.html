<html><body style="font-family: -apple-system, sans-serif;">
<h2>インストールが完了しました</h2>
<p>メニューバーの入力メニューで <b>Meltype</b> を選ぶと使えます。</p>
<p>入力メニューに出ていないときは、いったんログアウトしてログインし直してください。
それでも出ないときは、システム設定 → キーボード → 入力ソース →「編集…」→「+」→ 日本語 → Meltype を追加します。</p>
<p>アンインストールは、配布の zip に入っている「Uninstall Meltype.command」を使います。</p>
</body></html>
